name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.txt
      - run: .venv/bin/python -m compileall -q main.py auth.py models.py database.py migrations providers.py tests
      - run: .venv/bin/python -m pytest -q
      - run: DATABASE_URL=sqlite:///ci-empty.sqlite3 .venv/bin/alembic upgrade head
      - run: .venv/bin/alembic check
      - run: .venv/bin/pip install pip-audit
      - run: .venv/bin/pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e -- --project=desktop --project=desktop-1440 --project=tablet-768 --project=mobile
        working-directory: frontend

      - name: Upload browser test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-reports
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
